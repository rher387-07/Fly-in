[project]
name = "fly-in"
version = "0.1.0"
description = "Fly-In project dependency management"
authors = [
    {name = "hery-rak"}
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "webcolors (>=25.10.0,<26.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
